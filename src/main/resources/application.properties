spring.application.name=chamados

spring.datasource.url=jdbc:h2:mem:chamadosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.check-template-location=false

app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin1234}
app.security.technician.username=${TECHNICIAN_USERNAME:tecnico}
app.security.technician.password=${TECHNICIAN_PASSWORD:tecnico1234}

springdoc.swagger-ui.path=/swagger-ui.html
